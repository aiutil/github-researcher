name: Research data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pyyaml
      - run: python scripts/generate_readme.py
      - run: git diff --exit-code -- README.md README.zh-CN.md docs/images/research-activity.svg
